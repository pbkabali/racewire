name: Deploy

on:
  pull_request:
  push:
    branches: [staging, main]

concurrency:
  # Never let two deploys to the same target overlap. Not cancel-in-progress:
  # aborting mid-deploy can leave rules and hosting on different versions.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------- preview
  preview:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build against staging config
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build

      - name: Authenticate to Firebase
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy preview channel
        id: preview
        env:
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          # Hosting only -- a preview must never touch shared rules, indexes,
          # functions or Storage, which have no per-channel isolation.
          npx firebase-tools hosting:channel:deploy "pr-${{ github.event.number }}" \
            --project "$PROJECT_ID" \
            --expires 7d \
            --non-interactive \
            --json > channel.json
          URL=$(node -e "const r=require('./channel.json');const k=Object.keys(r.result)[0];console.log(r.result[k].url)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        uses: actions/github-script@v9
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}'
            const marker = '<!-- racewire-preview -->'
            const body = `${marker}\n**Preview:** ${url}\n\nHosting only, expires in 7 days. Rules, indexes and functions are not deployed to previews.`
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            // Update in place so repeated pushes do not spam the thread.
            const existing = comments.find((c) => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              })
            }

  # ---------------------------------------------------------------- staging
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci --prefix functions

      - name: Build against staging config
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build

      - name: Write functions runtime env
        # firebase-tools ships functions/.env values as runtime env vars.
        # Written here rather than committed so each environment gets its own,
        # and so an unset SHEET_ID stays empty instead of prompting at deploy.
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          SHEET_RANGE: ${{ vars.SHEET_RANGE }}
        run: |
          {
            echo "SHEET_ID=${SHEET_ID}"
            echo "SHEET_RANGE=${SHEET_RANGE:-Races!A1:E}"
          } > functions/.env

      - name: Authenticate to Firebase
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy
        env:
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          npx firebase-tools deploy \
            --only hosting,firestore:rules,firestore:indexes,storage,functions \
            --project "$PROJECT_ID" \
            --non-interactive \
            --force

  # ------------------------------------------------------------- production
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in repo settings to make
    # production deploys manual-approval rather than automatic.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci --prefix functions

      - name: Build against production config
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build

      - name: Write functions runtime env
        # firebase-tools ships functions/.env values as runtime env vars.
        # Written here rather than committed so each environment gets its own,
        # and so an unset SHEET_ID stays empty instead of prompting at deploy.
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          SHEET_RANGE: ${{ vars.SHEET_RANGE }}
        run: |
          {
            echo "SHEET_ID=${SHEET_ID}"
            echo "SHEET_RANGE=${SHEET_RANGE:-Races!A1:E}"
          } > functions/.env

      - name: Authenticate to Firebase
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy
        env:
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          npx firebase-tools deploy \
            --only hosting,firestore:rules,firestore:indexes,storage,functions \
            --project "$PROJECT_ID" \
            --non-interactive \
            --force
